<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 220" width="220" height="220">
  <defs>
    <filter id="shadowLove" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#ec4899" flood-opacity="0.4"/>
    </filter>
    <linearGradient id="heartPink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="50%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#db2777"/>
    </linearGradient>
  </defs>

  <!-- Big Glowing Love Heart -->
  <path d="M 110 90 C 90 40 30 50 30 100 C 30 145 110 185 110 185 C 110 185 190 145 190 100 C 190 50 130 40 110 90 Z" fill="url(#heartPink)" filter="url(#shadowLove)"/>
  
  <!-- Mini Letter in Heart -->
  <rect x="75" y="105" width="70" height="48" rx="6" fill="#ffffff" stroke="#f43f5e" stroke-width="2"/>
  <path d="M 75 105 L 110 130 L 145 105" fill="none" stroke="#f43f5e" stroke-width="2"/>
  <circle cx="110" cy="128" r="6" fill="#f43f5e"/>

  <!-- Kitty Peeking from Behind Heart -->
  <g transform="translate(10, -20)">
    <!-- Ears -->
    <path d="M 50 65 C 40 30 65 20 80 40 Z" fill="#ffffff" stroke="#334155" stroke-width="3.5" stroke-linejoin="round"/>
    <path d="M 56 60 C 48 38 62 32 72 44 Z" fill="#ffe4e6"/>

    <path d="M 150 65 C 160 30 135 20 120 40 Z" fill="#ffffff" stroke="#334155" stroke-width="3.5" stroke-linejoin="round"/>
    <path d="M 144 60 C 152 38 138 32 128 44 Z" fill="#ffe4e6"/>

    <!-- Head -->
    <ellipse cx="100" cy="80" rx="60" ry="46" fill="#ffffff" stroke="#334155" stroke-width="3.5"/>

    <!-- Ribbon -->
    <g transform="translate(125, 35) rotate(15)">
      <ellipse cx="-12" cy="0" rx="11" ry="8" fill="#f43f5e" stroke="#881337" stroke-width="1.5"/>
      <ellipse cx="12" cy="0" rx="11" ry="8" fill="#f43f5e" stroke="#881337" stroke-width="1.5"/>
      <circle cx="0" cy="0" r="6" fill="#fb7185" stroke="#881337" stroke-width="1.5"/>
    </g>

    <!-- Eyes (Happy Arc) -->
    <path d="M 70 82 Q 78 74 86 82" fill="none" stroke="#1e293b" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M 114 82 Q 122 74 130 82" fill="none" stroke="#1e293b" stroke-width="3.5" stroke-linecap="round"/>

    <!-- Yellow Nose -->
    <ellipse cx="100" cy="88" rx="5" ry="3.5" fill="#facc15" stroke="#ca8a04" stroke-width="1.2"/>

    <!-- Whiskers -->
    <line x1="42" y1="78" x2="58" y2="80" stroke="#334155" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="40" y1="86" x2="58" y2="86" stroke="#334155" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="158" y1="78" x2="142" y2="80" stroke="#334155" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="160" y1="86" x2="142" y2="86" stroke="#334155" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Paws on top of Heart -->
    <ellipse cx="65" cy="120" rx="14" ry="10" fill="#ffffff" stroke="#334155" stroke-width="3"/>
    <ellipse cx="135" cy="120" rx="14" ry="10" fill="#ffffff" stroke="#334155" stroke-width="3"/>
  </g>
</svg>
