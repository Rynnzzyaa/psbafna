<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#f43f5e" flood-opacity="0.3"/>
    </filter>
    <linearGradient id="bowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb7185"/>
      <stop offset="100%" stop-color="#e11d48"/>
    </linearGradient>
    <linearGradient id="heartGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#fda4af"/>
    </linearGradient>
  </defs>

  <!-- Kitty Head (White Glow) -->
  <g filter="url(#shadow)">
    <!-- Left Ear -->
    <path d="M 45 75 C 30 35 60 25 80 48 Z" fill="#ffffff" stroke="#334155" stroke-width="4" stroke-linejoin="round"/>
    <path d="M 52 68 C 42 45 58 40 70 52 Z" fill="#ffe4e6"/>

    <!-- Right Ear -->
    <path d="M 155 75 C 170 35 140 25 120 48 Z" fill="#ffffff" stroke="#334155" stroke-width="4" stroke-linejoin="round"/>
    <path d="M 148 68 C 158 45 142 40 130 52 Z" fill="#ffe4e6"/>

    <!-- Head Oval -->
    <ellipse cx="100" cy="105" rx="72" ry="58" fill="#ffffff" stroke="#334155" stroke-width="4"/>
  </g>

  <!-- Cute Red/Pink Ribbon Bow on Right Ear -->
  <g transform="translate(130, 45) rotate(15)">
    <!-- Left Loop -->
    <ellipse cx="-15" cy="0" rx="14" ry="10" fill="url(#bowGrad)" stroke="#881337" stroke-width="2"/>
    <!-- Right Loop -->
    <ellipse cx="15" cy="0" rx="14" ry="10" fill="url(#bowGrad)" stroke="#881337" stroke-width="2"/>
    <!-- Center Knot -->
    <circle cx="0" cy="0" r="8" fill="url(#bowGrad)" stroke="#881337" stroke-width="2"/>
  </g>

  <!-- Eyes (Big Cute Shiny Eyes) -->
  <ellipse cx="68" cy="105" rx="7" ry="10" fill="#1e293b"/>
  <circle cx="66" cy="101" r="3" fill="#ffffff"/>
  
  <ellipse cx="132" cy="105" rx="7" ry="10" fill="#1e293b"/>
  <circle cx="130" cy="101" r="3" fill="#ffffff"/>

  <!-- Yellow Cute Nose -->
  <ellipse cx="100" cy="116" rx="6" ry="4.5" fill="#facc15" stroke="#ca8a04" stroke-width="1.5"/>

  <!-- Whiskers Left -->
  <line x1="28" y1="102" x2="48" y2="105" stroke="#334155" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="25" y1="114" x2="48" y2="114" stroke="#334155" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="28" y1="126" x2="48" y2="123" stroke="#334155" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Whiskers Right -->
  <line x1="172" y1="102" x2="152" y2="105" stroke="#334155" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="175" y1="114" x2="152" y2="114" stroke="#334155" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="172" y1="126" x2="152" y2="123" stroke="#334155" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Blushing Cheeks -->
  <ellipse cx="52" cy="120" rx="9" ry="5.5" fill="#fda4af" opacity="0.8"/>
  <ellipse cx="148" cy="120" rx="9" ry="5.5" fill="#fda4af" opacity="0.8"/>

  <!-- Sparkles -->
  <path d="M 100 145 C 95 130 80 135 80 148 C 80 160 100 172 100 172 C 100 172 120 160 120 148 C 120 135 105 130 100 145 Z" fill="url(#heartGrad)"/>
</svg>
