services:
  - type: web
    name: afnalink
    runtime: docker
    plan: free
    region: singapore
    envVars:
      - key: APP_NAME
        value: AFNALINK
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: APP_KEY
        generateValue: true
      - key: LOG_CHANNEL
        value: stderr
      - key: RUN_SEEDER
        value: true
